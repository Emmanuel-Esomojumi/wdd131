<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive filtered temple album showcasing temples of The Church of Jesus Christ of Latter-day Saints using HTML, CSS and JavaScript for WDD 131.">
  <meta name="author" content="Esomojumi Sunday Emmanuel">
  <title>Filtered Temple Album</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <!-- CSS (mobile first, then large) -->
  <link rel="stylesheet" href="styles/filtered-temples.css">
  <link rel="stylesheet" href="styles/filtered-temples-large.css">

  <!-- JavaScript -->
  <script src="scripts/filtered-temples.js" defer></script>
</head>

<body>
  <header>
    <div class="header-content">
      <h2>Temple Album</h2>

      <!-- Hamburger Button -->
      <button id="menu-button" aria-label="Toggle navigation">☰</button>

      <!-- Navigation — data-filter drives JS filtering -->
      <nav id="navigation">
        <a href="#" data-filter="all">Home</a>
        <a href="#" data-filter="old">Old</a>
        <a href="#" data-filter="new">New</a>
        <a href="#" data-filter="large">Large</a>
        <a href="#" data-filter="small">Small</a>
      </nav>
    </div>
  </header>

  <main>
    <h1 id="gallery-title">Home</h1>

    <!-- JS renders temple cards here -->
    <section class="gallery" id="gallery"></section>
  </main>

  <footer>
    <p>
      © <span id="currentyear"></span> 🌺 Esomojumi Sunday Emmanuel 🌺 Lagos, Nigeria
    </p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
